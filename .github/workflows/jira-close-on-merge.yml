name: Close Jira ticket on PR merge

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key to close manually for testing or repair
        required: false
        type: string

jobs:
  close-jira:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Determine Jira issue key
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          manual_key='${{ github.event.inputs.issue_key || '' }}'
          pr_title='${{ github.event.pull_request.title || '' }}'
          pr_branch='${{ github.event.pull_request.head.ref || '' }}'

          if [[ -n "$manual_key" ]]; then
            key="$manual_key"
          elif [[ "$pr_title" =~ ^([A-Z][A-Z0-9]+-[0-9]+)\b ]]; then
            key="${BASH_REMATCH[1]}"
          elif [[ "$pr_branch" =~ ^([A-Z][A-Z0-9]+-[0-9]+)\b ]]; then
            key="${BASH_REMATCH[1]}"
          else
            echo "No Jira issue key found in PR title or branch; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Resolved Jira issue key: $key"

      - name: Close Jira issue
        if: steps.issue.outputs.skip != 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.issue.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from base64 import b64encode

          base = os.environ['JIRA_BASE_URL'].rstrip('/')
          email = os.environ['JIRA_USER_EMAIL']
          token = os.environ['JIRA_API_TOKEN']
          issue_key = os.environ['ISSUE_KEY']

          auth = b64encode(f"{email}:{token}".encode()).decode()
          headers = {
              'Authorization': f'Basic {auth}',
              'Accept': 'application/json',
              'Content-Type': 'application/json',
          }

          def request(method, path, data=None):
              url = f"{base}{path}"
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode() or '{}'
                      return resp.status, json.loads(raw)
              except urllib.error.HTTPError as e:
                  payload = e.read().decode() or '{}'
                  try:
                      parsed = json.loads(payload)
                  except Exception:
                      parsed = {'raw': payload}
                  return e.code, parsed

          status, issue = request('GET', f"/rest/api/3/issue/{urllib.parse.quote(issue_key)}?fields=status,resolution")
          if status == 404:
              print(f"Jira issue {issue_key} was not found; skipping.")
              sys.exit(0)
          if status >= 300:
              raise SystemExit(f"Failed to fetch issue {issue_key}: HTTP {status} {issue}")

          current_status = (((issue.get('fields') or {}).get('status') or {}).get('name') or '').strip()
          status_category = ((((issue.get('fields') or {}).get('status') or {}).get('statusCategory') or {}).get('key') or '').strip()
          if status_category == 'done':
              print(f"Issue {issue_key} is already done ({current_status}).")
              sys.exit(0)

          status, transitions = request('GET', f"/rest/api/3/issue/{urllib.parse.quote(issue_key)}/transitions")
          if status >= 300:
              raise SystemExit(f"Failed to fetch transitions for {issue_key}: HTTP {status} {transitions}")

          choices = transitions.get('transitions') or []
          preferred_names = {'Done', 'Closed', 'Complete', 'Completed', 'Resolved'}
          selected = None

          for transition in choices:
              to = transition.get('to') or {}
              category = ((to.get('statusCategory') or {}).get('key') or '').strip()
              name = (transition.get('name') or '').strip()
              if category == 'done' and name in preferred_names:
                  selected = transition
                  break

          if selected is None:
              for transition in choices:
                  to = transition.get('to') or {}
                  category = ((to.get('statusCategory') or {}).get('key') or '').strip()
                  if category == 'done':
                      selected = transition
                      break

          if selected is None:
              print(f"No done-like transition available for {issue_key}; skipping.")
              sys.exit(0)

          transition_id = selected['id']
          transition_name = selected.get('name', transition_id)
          status, response = request('POST', f"/rest/api/3/issue/{urllib.parse.quote(issue_key)}/transitions", {
              'transition': {'id': transition_id}
          })
          if status >= 300:
              raise SystemExit(f"Failed to transition {issue_key} via {transition_name}: HTTP {status} {response}")

          status, issue = request('GET', f"/rest/api/3/issue/{urllib.parse.quote(issue_key)}?fields=status,resolution,resolutiondate")
          if status >= 300:
              raise SystemExit(f"Transition posted but verification failed for {issue_key}: HTTP {status} {issue}")

          verified_status = (((issue.get('fields') or {}).get('status') or {}).get('name') or '').strip()
          verified_resolution = (((issue.get('fields') or {}).get('resolution') or {}).get('name') or '').strip()
          print(f"Closed {issue_key}: status={verified_status}, resolution={verified_resolution}, transition={transition_name}")
          PY
